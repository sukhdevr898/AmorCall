name: Build Flutter Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Duora_flutter/**'
      - '.github/workflows/build-flutter-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter --version

      - name: Setup Android v2 Scaffolding & Google Services
        working-directory: Duora_flutter
        run: |
          # Regenerate clean modern Android scaffolding
          rm -rf android
          flutter create . --platforms=android --org com.aistudio.amourcall.kpqlzx
          
          # Inject .env (From GitHub Secrets if present, or defaults)
          cat << 'EOF' > .env
          SERVER_URL=${{ secrets.SERVER_URL || 'https://amorcall.onrender.com' }}
          WEBSOCKET_URL=${{ secrets.WEBSOCKET_URL || 'wss://amorcall.onrender.com' }}
          FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY || 'AIzaSyBP4sQvCmbzd31mmG-clgJTCRX5_q9vODg' }}
          FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID || 'gen-lang-client-0617344108' }}
          FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID || '531599159732' }}
          FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID || '1:531599159732:android:8ff660c6233aadff08c2e1' }}
          STUN_SERVER_1=stun:stun.l.google.com:19302
          STUN_SERVER_2=stun:stun1.l.google.com:19302
          EOF

          # Create google-services.json directly
          mkdir -p android/app
          cat << 'EOF' > android/app/google-services.json
          {
            "project_info": {
              "project_number": "531599159732",
              "project_id": "gen-lang-client-0617344108",
              "storage_bucket": "gen-lang-client-0617344108.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:531599159732:android:8ff660c6233aadff08c2e1",
                  "android_client_info": {
                    "package_name": "com.aistudio.amourcall.kpqlzx"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "531599159732-0qvmv1mls6l0nti60nfom7vjd8m9n0t6.apps.googleusercontent.com",
                    "client_type": 1,
                    "android_info": {
                      "package_name": "com.aistudio.amourcall.kpqlzx",
                      "certificate_hash": "b49a61e466820f983f1c73bc12a1c02c143c310d"
                    }
                  },
                  {
                    "client_id": "531599159732-jeep919lqmr0nc7i5f7e9oo6vke8edlq.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyBP4sQvCmbzd31mmG-clgJTCRX5_q9vODg"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "531599159732-jeep919lqmr0nc7i5f7e9oo6vke8edlq.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Install Dependencies
        working-directory: Duora_flutter
        run: |
          flutter clean
          flutter pub get

      - name: Build Release APK
        working-directory: Duora_flutter
        run: flutter build apk --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: duora-flutter-release-apk
          path: Duora_flutter/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
