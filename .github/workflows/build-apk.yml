name: Build & Publish Duora APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'APK/**'
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Duora Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Keystore & Environment Secrets
        run: |
          touch .env
          if [ -f debug.keystore.base64 ]; then
            echo "Restoring debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "Generating debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey \
              -storepass android -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          chmod +x gradlew

      - name: Build Android Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Copy Built APK to APK Directory
        run: |
          mkdir -p APK
          APK_SOURCE="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_SOURCE" ]; then
            cp "$APK_SOURCE" APK/Duora-2.1.2.1.apk
            cp "$APK_SOURCE" APK/Duora.apk
            ls -lh APK/
          else
            echo "Error: Output APK not found at $APK_SOURCE"
            exit 1
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Duora-2.1.2.1-apk
          path: APK/Duora-2.1.2.1.apk
          if-no-files-found: error
          retention-days: 30

      - name: Commit & Push APK to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f APK/Duora-2.1.2.1.apk APK/Duora.apk APK/version.json
          if git diff --staged --quiet; then
            echo "No changes in APK directory to commit."
          else
            git commit -m "ci: auto-build and update APK in APK directory [skip ci]"
            git push origin main
          fi
