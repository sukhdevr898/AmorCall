name: duora_flutter
description: "Duora - Ultra-private couple call, chat, memories & video connection app built with Flutter."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & DI
  provider: ^6.1.2
  
  # Environment Variables & Configuration
  flutter_dotenv: ^5.1.0
  
  # Local Storage & Secure Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
  # Networking, WebSockets & WebRTC
  http: ^1.2.0
  web_socket_channel: ^2.4.5
  flutter_webrtc: ^0.10.7
  
  # Firebase & Authentication
  firebase_core: ^2.30.0
  firebase_auth: ^4.19.0
  cloud_firestore: ^4.17.0
  
  # UI & Styling Utilities
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  uuid: ^4.4.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
