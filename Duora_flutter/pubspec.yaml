name: duora_flutter
description: "Duora - Ultra-private couple call, chat, memories & video connection app built with Flutter."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & DI
  provider: ^6.1.2
  
  # Environment Variables & Configuration
  flutter_dotenv: ^5.2.1
  
  # Local Storage & Secure Storage
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  
  # Networking, WebSockets & WebRTC (Modern Flutter v2 Embedding)
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  flutter_webrtc: ^1.6.3
  
  # Firebase & Authentication
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  
  # UI & Styling Utilities
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  cached_network_image: ^3.4.1
  intl: ^0.19.0
  uuid: ^4.5.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
